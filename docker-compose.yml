version: '3.8'

services:
  viralclip-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viralclip-ai-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend/data:/app/backend/data
